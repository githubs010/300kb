<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo to PDF Converter</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cropper.js for image cropping -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            aspect-ratio: 3/4; /* typical phone camera ratio */
            background-color: #000;
            overflow: hidden;
            border-radius: 0.5rem;
        }
        #video-element {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures video fills container without distortion */
        }
        #canvas-element {
            display: none;
        }
        .cropper-container {
             max-width: 100%;
             margin: 0 auto;
        }
        #image-to-crop {
            display: block;
            max-width: 100%;
        }
        /* Custom Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-gray-900 flex justify-center text-gray-800">

    <div class="w-full h-full max-w-md bg-white flex flex-col relative shadow-2xl">
        
        <!-- Header -->
        <div class="bg-blue-600 p-4 text-white text-center shadow-md z-10 flex-shrink-0">
            <h1 class="text-xl font-bold tracking-wide">Scanner App</h1>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col">
            
            <!-- Section 1: Camera View -->
            <div id="section-camera" class="flex flex-col gap-4">
                <div id="camera-container" class="shadow-inner">
                    <video id="video-element" autoplay playsinline></video>
                </div>
                
                <div class="flex flex-col gap-2">
                     <p class="text-sm text-gray-500 text-center mb-2" id="camera-status">Initializing camera...</p>
                    
                    <!-- File input fallback -->
                    <label class="block text-center text-sm font-medium text-gray-700 cursor-pointer">
                        Or select from gallery:
                        <input type="file" id="file-input" accept="image/*" class="mt-1 block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100" />
                    </label>

                    <button id="capture-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-md transition duration-300 disabled:opacity-50 flex justify-center items-center gap-2" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                        Take Photo
                    </button>
                    
                    <button id="switch-camera-btn" class="w-full py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-medium transition duration-300 flex justify-center items-center gap-2 hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                        Switch Camera
                    </button>
                </div>
            </div>

            <!-- Section 2: Crop View -->
            <div id="section-crop" class="hidden flex flex-col gap-4">
                <div class="bg-gray-100 p-2 rounded-lg border border-gray-200">
                    <img id="image-to-crop" src="" alt="Image to crop">
                </div>
                
                <div class="flex gap-2">
                    <button id="retake-btn" class="w-1/3 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg font-medium transition duration-300">
                        Retake
                    </button>
                    <button id="crop-btn" class="w-2/3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold shadow-md transition duration-300 flex justify-center items-center">
                        Crop & Compress
                    </button>
                </div>
            </div>

            <!-- Section 3: Processing & Result View -->
            <div id="section-result" class="hidden flex flex-col gap-4">
                
                <!-- Status Box -->
                <div id="processing-status" class="bg-blue-50 border border-blue-200 p-4 rounded-lg flex items-center justify-center text-blue-800 font-medium hidden">
                    <div class="loader"></div> <span id="status-text">Processing image...</span>
                </div>

                <!-- Final Image Preview (Hidden initially) -->
             <div id="final-preview-container" class="hidden flex flex-col items-center gap-2">
                <p class="text-sm font-semibold text-gray-700">Preview (Compressed):</p>
                <img id="final-image" src="" alt="Final Output" class="max-w-full h-auto max-h-48 rounded shadow-sm border border-gray-300 object-contain">
                <p id="file-size-info" class="text-xs font-mono bg-gray-100 p-1 rounded"></p>
             </div>

            <!-- Action Buttons -->
            <div id="result-actions" class="hidden flex flex-col gap-3 mt-auto pt-4 border-t border-gray-200">
                
                <div class="w-full">
                    <label for="file-name-input" class="block text-sm font-medium text-gray-700 mb-1">File Name</label>
                    <input type="text" id="file-name-input" value="Scanned_Document" class="block w-full rounded-lg border-gray-300 bg-gray-50 border p-3 text-gray-900 focus:border-blue-500 focus:ring-blue-500 outline-none transition" placeholder="Enter file name...">
                </div>

                <div class="flex gap-2">
                    <button id="download-pdf-btn" class="w-1/2 py-3 bg-gray-800 hover:bg-gray-900 text-white rounded-lg font-bold shadow-md transition duration-300 flex justify-center items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Save PDF
                    </button>
                    
                    <button id="share-btn" class="w-1/2 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md transition duration-300 flex justify-center items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        Share
                    </button>
                </div>

                <button id="start-over-btn" class="w-full py-3 mt-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-medium transition duration-300">
                    Start Over
                </button>
            </div>
        </div>

    </div>
</div>

<!-- Hidden Canvas for grabbing video frame -->
    <canvas id="canvas-element"></canvas>

    <script>
        // --- State and Variables ---
        const TARGET_MAX_SIZE_KB = 300;
        const TARGET_MAX_SIZE_BYTES = TARGET_MAX_SIZE_KB * 1024;
        
        let stream = null;
        let cropper = null;
        let currentFacingMode = 'environment'; // Default to back camera
        let compressedImageBlob = null; // Store final blob for PDF
        
        // --- DOM Elements ---
        // Sections
        const sectionCamera = document.getElementById('section-camera');
        const sectionCrop = document.getElementById('section-crop');
        const sectionResult = document.getElementById('section-result');
        
        // Video/Canvas
        const video = document.getElementById('video-element');
        const canvas = document.getElementById('canvas-element');
        
        // Buttons
        const captureBtn = document.getElementById('capture-btn');
        const switchCameraBtn = document.getElementById('switch-camera-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const cropBtn = document.getElementById('crop-btn');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');
        const shareBtn = document.getElementById('share-btn');
        const fileNameInput = document.getElementById('file-name-input');
        const startOverBtn = document.getElementById('start-over-btn');
        const fileInput = document.getElementById('file-input');
        
        // Images/Info
        const imageToCrop = document.getElementById('image-to-crop');
        const finalImage = document.getElementById('final-image');
        const fileSizeInfo = document.getElementById('file-size-info');
        const cameraStatus = document.getElementById('camera-status');
        
        // Processing UI
        const processingStatus = document.getElementById('processing-status');
        const statusText = document.getElementById('status-text');
        const finalPreviewContainer = document.getElementById('final-preview-container');
        const resultActions = document.getElementById('result-actions');

        // --- Camera Functions ---
        async function startCamera(facingMode = 'environment') {
            stopCamera(); // Ensure previous stream is closed

            try {
                // Constraints for modern mobile cameras
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Wait for video metadata to load before enabling capture
                video.onloadedmetadata = () => {
                    video.play();
                    captureBtn.disabled = false;
                    cameraStatus.textContent = "Camera ready.";
                    cameraStatus.className = "text-sm text-green-600 text-center mb-2";
                };

                // Check if multiple cameras exist to show switch button
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                if (videoDevices.length > 1) {
                    switchCameraBtn.classList.remove('hidden');
                }

            } catch (err) {
                console.error("Error accessing camera:", err);
                cameraStatus.textContent = "Camera access denied or unavailable. Use file upload.";
                cameraStatus.className = "text-sm text-red-500 text-center mb-2 font-semibold";
                captureBtn.disabled = true;
                
                // Inform user about using the fallback
                alert("Could not access camera. Please ensure permissions are granted, or use the 'select from gallery' option.");
            }
        }

        function stopCamera() {
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
            }
        }

        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            cameraStatus.textContent = "Switching camera...";
            cameraStatus.className = "text-sm text-gray-500 text-center mb-2";
            captureBtn.disabled = true;
            startCamera(currentFacingMode);
        });

        captureBtn.addEventListener('click', () => {
            // Draw video frame to canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert to data URL and proceed to crop
            const imageUrl = canvas.toDataURL('image/jpeg');
            loadCropper(imageUrl);
        });

        // Handle File Input (Fallback)
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    loadCropper(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // --- Cropping Functions ---
        function loadCropper(imageUrl) {
            stopCamera(); // Stop camera to save resources
            
            // UI Switch
            sectionCamera.classList.add('hidden');
            sectionCrop.classList.remove('hidden');
            
            // Set image source
            imageToCrop.src = imageUrl;
            
            // Initialize Cropper.js
            if (cropper) {
                cropper.destroy();
            }
            
            // Need a slight delay to ensure image is rendered before attaching cropper
            setTimeout(() => {
                 cropper = new Cropper(imageToCrop, {
                    viewMode: 2, // Restrict crop box not to exceed size of canvas
                    dragMode: 'move',
                    autoCropArea: 0.9,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                });
            }, 100);
        }

        retakeBtn.addEventListener('click', () => {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            fileInput.value = ''; // Reset file input
            sectionCrop.classList.add('hidden');
            sectionCamera.classList.remove('hidden');
            startCamera(currentFacingMode);
        });

        // --- Compression Functions ---
        cropBtn.addEventListener('click', async () => {
            if (!cropper) return;

            // UI Switch to processing
            sectionCrop.classList.add('hidden');
            sectionResult.classList.remove('hidden');
            
            processingStatus.classList.remove('hidden');
            finalPreviewContainer.classList.add('hidden');
            resultActions.classList.add('hidden');
            statusText.textContent = "Cropping image...";

            // 1. Get cropped image as a canvas
            // We scale it down initially if it's huge to help with compression
            const croppedCanvas = cropper.getCroppedCanvas({
                maxWidth: 2048,
                maxHeight: 2048
            });

            if (!croppedCanvas) {
                alert("Failed to crop image.");
                return;
            }

            // 2. Compress the image to target size
            statusText.textContent = `Compressing to under ${TARGET_MAX_SIZE_KB}KB...`;
            
            try {
                const resultBlob = await compressImageToTarget(croppedCanvas, TARGET_MAX_SIZE_BYTES);
                
                // Success
                compressedImageBlob = resultBlob;
                
                // Display final result
                const resultUrl = URL.createObjectURL(resultBlob);
                finalImage.src = resultUrl;
                
                const sizeKB = (resultBlob.size / 1024).toFixed(2);
                fileSizeInfo.textContent = `Final Size: ${sizeKB} KB`;
                
                if (resultBlob.size > TARGET_MAX_SIZE_BYTES) {
                     fileSizeInfo.classList.add('text-yellow-600', 'bg-yellow-50');
                     fileSizeInfo.textContent += ` (Note: Could not compress below ${TARGET_MAX_SIZE_KB}KB without severe quality loss)`;
                } else {
                     fileSizeInfo.classList.add('text-green-600', 'bg-green-50');
                }

                // Update UI
                processingStatus.classList.add('hidden');
                finalPreviewContainer.classList.remove('hidden');
                resultActions.classList.remove('hidden');

            } catch (error) {
                console.error("Compression error:", error);
                statusText.textContent = "Error during compression.";
                processingStatus.classList.replace('text-blue-800', 'text-red-800');
                processingStatus.classList.replace('bg-blue-50', 'bg-red-50');
                processingStatus.querySelector('.loader').style.display = 'none';
                
                // Add a button to go back
                const backBtn = document.createElement('button');
                backBtn.textContent = "Go Back";
                backBtn.className = "mt-2 px-4 py-2 bg-gray-200 rounded";
                backBtn.onclick = () => {
                    sectionResult.classList.add('hidden');
                    sectionCrop.classList.remove('hidden');
                    processingStatus.classList.add('hidden');
                    processingStatus.classList.replace('text-red-800', 'text-blue-800');
                    processingStatus.classList.replace('bg-red-50', 'bg-blue-50');
                    processingStatus.querySelector('.loader').style.display = 'inline-block';
                };
                processingStatus.appendChild(backBtn);
            }
        });

        /**
         * Helper function to convert canvas to Blob via Promise
         */
        function canvasToBlob(canvas, type, quality) {
            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    resolve(blob);
                }, type, quality);
            });
        }

        /**
         * Iteratively compresses an image canvas by adjusting JPEG quality 
         * and resizing if necessary to hit a target byte size.
         */
        async function compressImageToTarget(sourceCanvas, targetBytes) {
            let quality = 0.9;
            const minQuality = 0.1;
            const qualityStep = 0.1;
            
            // First, try just lowering quality
            let blob = await canvasToBlob(sourceCanvas, 'image/jpeg', quality);
            
            while (blob.size > targetBytes && quality > minQuality) {
                quality -= qualityStep;
                blob = await canvasToBlob(sourceCanvas, 'image/jpeg', quality);
                console.log(`Trying quality ${quality.toFixed(1)}, size: ${(blob.size/1024).toFixed(1)}KB`);
            }

            // If quality is at minimum and it's STILL too big, we need to resize the canvas
            if (blob.size > targetBytes) {
                let scale = 0.8;
                let currentCanvas = sourceCanvas;
                
                while (blob.size > targetBytes && scale > 0.3) {
                    console.log(`Scaling down image by ${scale}...`);
                    const newWidth = Math.floor(currentCanvas.width * scale);
                    const newHeight = Math.floor(currentCanvas.height * scale);
                    
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = newWidth;
                    tempCanvas.height = newHeight;
                    const ctx = tempCanvas.getContext('2d');
                    
                    // Draw scaled image
                    ctx.drawImage(currentCanvas, 0, 0, newWidth, newHeight);
                    
                    // Try medium quality on the smaller image
                    blob = await canvasToBlob(tempCanvas, 'image/jpeg', 0.6);
                    console.log(`Scaled size: ${(blob.size/1024).toFixed(1)}KB`);
                    
                    // Prepare for next iteration if needed
                    currentCanvas = tempCanvas;
                    scale -= 0.1;
                }
            }
            
            return blob;
        }

        // --- PDF Generation Functions ---
        
        async function buildPDF() {
            return new Promise((resolve, reject) => {
                if (!compressedImageBlob) {
                    reject("No image available");
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(compressedImageBlob);
                
                reader.onloadend = () => {
                    try {
                        const base64data = reader.result;
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = pdf.internal.pageSize.getHeight();
                        const margin = 10;
                        const maxImgWidth = pdfWidth - (margin * 2);
                        const maxImgHeight = pdfHeight - (margin * 2) - 20;
                        
                        const img = new Image();
                        img.onload = () => {
                            let imgWidth = img.width;
                            let imgHeight = img.height;
                            const ratio = imgWidth / imgHeight;
                            
                            if (imgWidth > maxImgWidth) {
                                imgWidth = maxImgWidth;
                                imgHeight = imgWidth / ratio;
                            }
                            if (imgHeight > maxImgHeight) {
                                imgHeight = maxImgHeight;
                                imgWidth = imgHeight * ratio;
                            }
                            
                            const xOffset = (pdfWidth - imgWidth) / 2;
                            const yOffset = margin + 15;

                            // Custom File Name
                            let fileName = fileNameInput.value.trim();
                            if (!fileName) fileName = 'Scanned_Document';

                            // Add Title
                            pdf.setFontSize(14);
                            pdf.text(fileName, pdfWidth / 2, margin + 5, { align: "center" });
                            
                            // Add Image
                            pdf.addImage(base64data, 'JPEG', xOffset, yOffset, imgWidth, imgHeight);
                            
                            // Add Footer
                            pdf.setFontSize(10);
                            pdf.setTextColor(150);
                            const dateStr = new Date().toLocaleString();
                            pdf.text(`Generated on: ${dateStr}`, pdfWidth / 2, pdfHeight - margin, { align: "center" });

                            resolve({ pdf, fileName });
                        };
                        img.src = base64data;
                    } catch (err) {
                        reject(err);
                    }
                };
            });
        }

        downloadPdfBtn.addEventListener('click', async () => {
            const originalBtnText = downloadPdfBtn.innerHTML;
            downloadPdfBtn.innerHTML = '<div class="loader" style="width: 18px; height: 18px; border-width: 2px;"></div> Saving...';
            downloadPdfBtn.disabled = true;

            try {
                const { pdf, fileName } = await buildPDF();
                pdf.save(`${fileName}.pdf`);
            } catch (error) {
                console.error("PDF generation error:", error);
                alert("An error occurred while saving the PDF.");
            } finally {
                downloadPdfBtn.innerHTML = originalBtnText;
                downloadPdfBtn.disabled = false;
            }
        });

        shareBtn.addEventListener('click', async () => {
            const originalBtnText = shareBtn.innerHTML;
            shareBtn.innerHTML = '<div class="loader" style="width: 18px; height: 18px; border-width: 2px;"></div> Prep...';
            shareBtn.disabled = true;

            try {
                const { pdf, fileName } = await buildPDF();
                
                // Get the PDF as a Blob
                const pdfBlob = pdf.output('blob');
                
                // Create a File object for sharing
                const file = new File([pdfBlob], `${fileName}.pdf`, { type: 'application/pdf' });
                
                // Use Web Share API if supported
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: fileName,
                        text: 'Here is the scanned document.',
                        files: [file]
                    });
                } else {
                    alert("Direct file sharing is not supported on this browser/device. The file will be downloaded instead.");
                    pdf.save(`${fileName}.pdf`);
                }
            } catch (error) {
                console.error("Share error:", error);
                // Don't alert if the user just cancelled the share popup
                if (error.name !== 'AbortError') {
                    alert("An error occurred while trying to share.");
                }
            } finally {
                shareBtn.innerHTML = originalBtnText;
                shareBtn.disabled = false;
            }
        });

        startOverBtn.addEventListener('click', () => {
            // Reset state
            compressedImageBlob = null;
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            fileInput.value = '';
            
            // Reset UI
            sectionResult.classList.add('hidden');
            sectionCamera.classList.remove('hidden');
            
            // Clean up file size info classes
            fileSizeInfo.className = 'text-xs font-mono p-1 rounded';
            
            // Restart camera
            startCamera(currentFacingMode);
        });

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            // Attempt to start camera immediately
            startCamera();
        });

    </script>
</body>
</html>
